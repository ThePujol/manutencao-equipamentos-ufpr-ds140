<a
	[routerLink]="routerLink"
	routerLinkActive="bg-[#331F80] font-semibold"
	[routerLinkActiveOptions]="{ exact: true }"
	class="rounded-md px-[30px] py-2.5 w-full hover:bg-[#3e2996] duration-150 flex items-center gap-1"
>
	<mat-icon>{{ icon }}</mat-icon>
	<p>{{ text }}</p>
</a>
<router-outlet></router-outlet>
