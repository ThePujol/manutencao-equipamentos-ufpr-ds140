<div class="fixed inset-0 backdrop-blur-sm flex items-center justify-center z-50">
	<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 items-center">
		<div class="flex justify-between items-center mb-8">
			<h2 class="text-xl font-semibold">Histórico da Solicitação</h2>
			<button
				class="cursor-pointer rounded-full hover:bg-gray-950/5 p-1 w-7 h-7 duration-150"
				(click)="fecharModal.emit()"
			>
				✖
			</button>
		</div>

		@if (historico.length > 0) {
			<ul class="flex flex-col gap-1 overflow-scroll max-h-[560px]">
				@for (h of historico; track $index) {
					<li class="mb-3 rounded-md border border-black/20 p-3">
						<div class="flex justify-between items-center">
							<span class="font-bold text-primary">{{ h.situacao }}</span>
							<span class="text-xs text-black/60">{{ h.dataHora | date: 'dd/MM/yyyy HH:mm' }}</span>
						</div>
						@if (h.observacao) {
							<div class="text-black/60 text-sm mt-1">{{ h.observacao }}</div>
						}
					</li>
				}
			</ul>
		} @else {
			<p class="text-gray-500">Nenhum histórico encontrado.</p>
		}
	</div>
</div>
