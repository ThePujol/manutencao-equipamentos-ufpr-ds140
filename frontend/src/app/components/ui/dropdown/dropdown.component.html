<td class="w-56 text-right h-4 flex items-center justify-end text-gray-950/50 hover:text-primary duration-150">
	<button
		class="pl-5 pr-3 py-1 rounded-md outline text-primary outline-primary-950/20 flex justify-between gap-2 duration-150 cursor-pointer"
		(click)="toggleDropdown($event)"
	>
		<p>Ações</p>
		<ng-icon name="matArrowDropDownOutline" class="text-2xl" />
	</button>

	@if (dropdown) {
		<div class="bg-white outline outline-gray-950/20 absolute mt-[185px] text-black rounded-md py-2 text-left z-50">
			<ul class="w-full">
				<li class="cursor-pointer hover:bg-gray-950/10 px-5 py-1">
					<button
						class="cursor-pointer disabled:cursor-not-allowed"
						[disabled]="solicitacao.situacao !== situacoes.aprovada"
						(click)="efetuarManutencao(solicitacao)"
					>
						Efetuar manutenção
					</button>
				</li>

				<li class="cursor-pointer hover:bg-gray-950/10 px-5 py-1">
					<button
						class="cursor-pointer disabled:cursor-not-allowed"
						[disabled]="
							solicitacao.situacao === situacoes.finalizada ||
							solicitacao.situacao === situacoes.paga ||
							solicitacao.situacao === situacoes.arrumada
						"
						(click)="redirecionarManutencao(solicitacao)"
					>
						Redirecionar solicitação
					</button>
				</li>

				<li class="cursor-pointer hover:bg-gray-950/10 px-5 py-1">
					<button class="cursor-pointer disabled:cursor-not-allowed" (click)="visualizarHistorico(solicitacao)">
						Visualizar histórico
					</button>
				</li>

				<li class="hover:bg-gray-950/10 px-5 py-1 cursor-pointer">
					<button
						class="cursor-pointer disabled:cursor-not-allowed"
						(click)="finalizarManutencao(solicitacao)"
						[disabled]="solicitacao.situacao !== situacoes.paga"
					>
						Finalizar solicitação
					</button>
				</li>
			</ul>
		</div>
	}
</td>
