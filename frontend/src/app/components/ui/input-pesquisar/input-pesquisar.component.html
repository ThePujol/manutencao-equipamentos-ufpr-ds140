<form [formGroup]="pesquisarForm" (ngSubmit)="onSubmit()">
	<input
		class="focus:outline-none border-1 border-gray-900/15 p-2.5 pl-10 w-[351px] rounded-md rounded-r-none bg-[url(/search-icon.png)] bg-[position:10px_center] bg-no-repeat"
		type="text"
		[placeholder]="placeholder"
		formControlName="query"
	/>

	<button
		class="w-[125px] bg-[#4931A9] outline-1 outline-[#4931A9] cursor-pointer hover:bg-[#3e2996] duration-150 text-white rounded-md rounded-l-none p-2.5"
		type="submit"
	>
		Pesquisar
	</button>
</form>
