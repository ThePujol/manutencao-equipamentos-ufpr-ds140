<main class="flex gap-10 h-full">
	<app-sidebar-funcionario></app-sidebar-funcionario>
	<section class="flex flex-col py-10 gap-[30px] pr-10 w-full overflow-y-auto">
		<div>
			<h1 class="text-[40px] font-semibold text-[#4931A9]">Categorias</h1>
			<h2 class="opacity-50 font-light text-[18px]">
				Aqui, você pode criar, editar ou remover categorias do repair.io.
			</h2>
		</div>

		<div class="flex justify-between w-full items-center">
			<app-input-pesquisar placeholder="Pesquise uma categoria..." (pesquisarClick)="pesquisarCategoria($event)" />
			<app-secondary-button text="Nova categoria" (funcao)="abrirModalEditar()" />
		</div>
		<app-tabela
			[columns]="headersTabela"
			[gridData]="listaCategorias"
			(editarClicked)="abrirModalEditar($event)"
			(excluirClicked)="removerCategoria($event.id)"
		/>
		<p class="mt-3 text-sm text-gray-900/70 font-light">
			Exibindo 1-{{ listaCategorias.length }} itens de {{ listaCategorias.length }} itens.
		</p>
	</section>

	<!-- Modal Editar -->
	@if (modalEditar) {
		<section class="fixed inset-0 backdrop-blur-sm flex items-center justify-center z-50">
			<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
				<div class="flex justify-between items-center mb-4">
					<h2 class="text-xl font-semibold text-gray-800">
						{{ categoriaSelecionada ? 'Editar Categoria' : 'Nova Categoria' }}
					</h2>
					<button
						class="cursor-pointer rounded-full hover:bg-gray-950/5 p-1 w-7 h-7 duration-150"
						(click)="fecharModal()"
					>
						✖
					</button>
				</div>

				<form [formGroup]="formCategoria" (ngSubmit)="salvarOuEditarCategoria()">
					<div class="mb-4">
						<app-input-text
							[label]="'Nome'"
							controlName="descricao"
							[type]="'text'"
							[placeholder]="'Ex: Desktop'"
							[required]="true"
						/>

						<div
							*ngIf="formCategoria.get('descricao')?.touched && formCategoria.get('descricao')?.invalid"
							class="text-red-500 text-sm mt-1"
						>
							Campo obrigatório.
						</div>
					</div>

					<div class="flex justify-end space-x-3">
						<app-secondary-button text="Cancelar" (funcao)="fecharModal()" />
						<app-button text="Salvar" type="submit" />
					</div>
				</form>
			</div>
		</section>
	}
</main>
