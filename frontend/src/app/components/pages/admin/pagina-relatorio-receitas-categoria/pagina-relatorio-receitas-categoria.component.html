<main class="flex gap-10 h-full">
  <app-sidebar-funcionario></app-sidebar-funcionario>

  <section class="flex flex-col py-10 gap-[30px] pr-10 w-full overflow-y-auto">
    <div>
      <h1 class="text-[40px] font-semibold text-[#4931A9]">
        Relatório de Receitas (por categoria)
      </h1>
      <h2 class="opacity-50 font-light text-[18px]">
        Receita acumulada agrupada por categoria.
      </h2>
    </div>

    <!-- Filtros e Botão Gerar PDF -->
    <div class="mb-6 flex items-end gap-4">
      <app-multi-select-estado (estadosChange)="estadosSelecionados = $event"></app-multi-select-estado>
      <button
        (click)="gerarPDF()"
        [disabled]="!resultados.length"
        class="px-4 py-2 rounded-md bg-[#4931A9] text-white font-medium hover:bg-[#3e2996] duration-150 disabled:opacity-50"
      >
        Gerar PDF
      </button>
    </div>

    <!-- Tabela -->
    <table *ngIf="resultados.length" class="w-full table-auto bg-white rounded-lg shadow overflow-hidden">
      <thead class="bg-[#4931A9] text-white">
        <tr>
          <th class="px-6 py-3 text-left">Categoria</th>
          <th class="px-6 py-3 text-right">Total (R$)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of resultados; let i = index" class="even:bg-gray-50">
          <td class="px-6 py-4 text-gray-800">{{ r.categoria }}</td>
          <td class="px-6 py-4 text-gray-800 text-right">{{ r.total | number:'1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!resultados.length" class="text-gray-700">Nenhum registro encontrado.</p>
    <p *ngIf="resultados.length" class="mt-3 text-sm text-gray-600 font-light">
      Exibindo {{ resultados.length }} itens.
    </p>
  </section>

  <app-mensagem [mensagem]="mensagem" [showMessage]="showMessage"></app-mensagem>
</main>

<router-outlet></router-outlet>
