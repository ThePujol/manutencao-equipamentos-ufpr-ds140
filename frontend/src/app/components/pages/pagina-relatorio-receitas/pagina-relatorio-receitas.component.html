<main class="flex gap-10 h-full">
  <!-- 1. Menu lateral -->
  <app-sidebar-funcionario></app-sidebar-funcionario>

  <!-- 2. Conteúdo -->
  <section class="flex flex-col py-10 gap-[30px] pr-10 w-full overflow-y-auto">
    <!-- Cabeçalho -->
    <div>
      <h1 class="text-[40px] font-semibold text-[#4931A9]">
        Relatório de Receitas (por dia)
      </h1>
      <h2 class="opacity-50 font-light text-[18px]">
        Filtre o período e gere o PDF.
      </h2>
    </div>

    <!-- Filtros e Botões -->
    <div class="flex justify-between items-end mb-6">
      <div class="flex gap-4">
        <div class="flex flex-col">
          <label for="dataInicio" class="font-medium mb-1">Data início</label>
          <input
            id="dataInicio"
            type="date"
            [(ngModel)]="dataInicio"
            name="dataInicio"
            class="px-3 py-2 rounded-md border border-gray-300 focus:outline-primary"
          />
        </div>
        <div class="flex flex-col">
          <label for="dataFim" class="font-medium mb-1">Data fim</label>
          <input
            id="dataFim"
            type="date"
            [(ngModel)]="dataFim"
            name="dataFim"
            class="px-3 py-2 rounded-md border border-gray-300 focus:outline-primary"
          />
        </div>
      </div>
      <div class="flex gap-3">
        <button
          (click)="buscar()"
          class="px-4 py-2 rounded-md bg-[#4931A9] text-white font-medium hover:bg-[#3e2996] duration-150"
        >
          Buscar
        </button>
        <button
          (click)="gerarPDF()"
          [disabled]="!resultados.length"
          class="px-4 py-2 rounded-md border border-[#4931A9] text-[#4931A9] font-medium hover:bg-[#4931A9] hover:text-white duration-150 disabled:opacity-50"
        >
          Gerar PDF
        </button>
      </div>
    </div>

    <!-- Tabela -->
    <table *ngIf="resultados.length" class="w-full table-auto bg-white rounded-lg shadow overflow-hidden">
      <thead class="bg-[#4931A9] text-white">
        <tr>
          <th class="px-6 py-3 text-left">Data</th>
          <th class="px-6 py-3 text-right">Total (R$)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of resultados; let i = index" class="even:bg-gray-50">
          <td class="px-6 py-4 text-gray-800">{{ r.data | date:'dd/MM/yyyy' }}</td>
          <td class="px-6 py-4 text-gray-800 text-right">{{ r.total | number:'1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!resultados.length" class="text-gray-700">Nenhum registro encontrado.</p>
    <p *ngIf="resultados.length" class="mt-3 text-sm text-gray-600 font-light">
      Exibindo {{ resultados.length }} itens.
    </p>
  </section>

  <!-- 3. Mensagem de feedback -->
  <app-mensagem [mensagem]="mensagem" [showMessage]="showMessage"></app-mensagem>
</main>

<router-outlet></router-outlet>
